name: Deploy React App & Infrastructure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra-and-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # - name: Deploy Bicep Infrastructure
      #   id: bicep
      #   uses: azure/arm-deploy@v2
      #   with:
      #     resourceGroupName: 'rg-thebabycowboy'
      #     template: './Infra/main.bicep'
      #     parameters: location='centralindia' staticWebAppName='thebabycowboy-ui-dev'
      - name: Deploy Bicep Infrastructure
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: 'rg-thebabycowboy'
          template: './Infra/main.bicep'
          parameters: location=centralus staticWebAppName=thebabycowboy-admin

      - name: Build and Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.bicep.outputs.staticWebAppDeploymentToken }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          api_location: ''
          output_location: 'dist' # Vite builds to the 'dist' folder
        env:
          VITE_MEDIA_API_URL: ${{ secrets.VITE_MEDIA_API_BASE_URL }}
          VITE_CONTENT_API_URL: ${{ secrets.VITE_CONTENT_API_URL }}
          # VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_ENTRA_CONTENT_API_SCOPE: ${{ secrets.VITE_ENTRA_CONTENT_API_SCOPE }}
          VITE_ENTRA_TENANT_SUBDOMAIN: ${{ secrets.VITE_ENTRA_TENANT_SUBDOMAIN }}
          VITE_ENTRA_TENANT_DOMAIN: ${{ secrets.VITE_ENTRA_TENANT_DOMAIN }}
          VITE_ENTRA_ADMIN_CLIENT_ID: ${{ secrets.VITE_ENTRA_ADMIN_CLIENT_ID }}
          VITE_ENTRA_MEDIA_API_SCOPE: ${{ secrets.VITE_ENTRA_MEDIA_API_SCOPE }}